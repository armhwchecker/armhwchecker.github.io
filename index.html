<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARM Business School · Homework</title>
<meta name="description" content="ARM Business School homework portal.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23FFD24A'/><text x='32' y='45' font-size='36' font-family='Georgia,serif' font-weight='700' text-anchor='middle' fill='%23000'>A</text></svg>">
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
  iframe{border:0;width:100%;height:100%;display:block}
  #wait{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:2;background:#000}
  .m{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;margin:0 auto 18px;
    background:#FFD24A;color:#000;font-weight:700;font-size:25px;font-family:Georgia,serif}
  .eyebrow{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#FFD24A;margin-bottom:12px}
  h1{font-size:18px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em}
  p{color:#C2C2C2;font-size:14px;margin:0;line-height:1.6}
  a{color:#FFD24A}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#FFD24A;margin:0 3px;animation:b 1.2s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:.15s} .dot:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:.7}}
</style>
</head>
<body>

<!--
  ===================================================================
  ARM Business School — the short address for the homework portal
  ===================================================================

  The portal is shown inside this page, so the address bar keeps
  saying armhwchecker.github.io the whole time.

  TWO THINGS MUST BE TRUE OR THIS FALLS BACK TO FORWARDING:

  1. Dashboard -> Student portal -> A short web address ->
     "Let this portal be shown inside another website" must be ON.
     Without it Google refuses to appear inside any other site.

  2. Deploy -> Manage deployments -> Who has access must be ANYONE.
     Not "Anyone with Google account" — that one asks a student to
     sign in to Google, and inside a page it simply answers 401.

  If the portal does not appear within five seconds — some phones
  block one site's cookies inside another — this page quietly sends
  the student to the portal's own address instead. They always get
  there; on those phones they just see the long address.

  TO CHANGE THE DESTINATION: edit APP below. Only needed if you make
  a brand new Apps Script deployment, not for Deploy -> New version.
  ===================================================================
-->

<script>
  var APP = "https://script.google.com/macros/s/AKfycbya56V2Rc7ZYzz2QNeis3ajD9fBjRWZiDTaXQIodJ_s9NOla9qxzBKoMoYre7VV6FTmPQ/exec?p=student";
</script>

<div id="wait">
  <div>
    <div class="m">A</div>
    <div class="eyebrow">ARM Business School</div>
    <h1>Opening your homework</h1>
    <p><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
    <p style="margin-top:14px">Taking too long? <a id="direct" href="#">Tap here.</a></p>
  </div>
</div>

<iframe id="app" title="ARM Business School homework portal" allow="clipboard-write"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  (function () {
    var frame = document.getElementById('app');
    var wait  = document.getElementById('wait');
    var shown = false;

    document.getElementById('direct').href = APP;

    frame.addEventListener('load', function () {
      shown = true;
      wait.style.display = 'none';
    });

    frame.src = APP;

    // Some phones will not let one site use another site's cookies inside it.
    // The frame then never finishes loading, so rather than leave the student
    // looking at nothing, send them to the portal's own address.
    setTimeout(function () { if (!shown) location.replace(APP); }, 5000);
  })();
</script>

</body>
</html>
